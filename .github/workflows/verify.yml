name: Verify exported study artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metrics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/reproduce.py
      - run: python -m unittest discover -s tests -v
  kernels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-kernels.txt
      - run: python scripts/generate_kernels.py
